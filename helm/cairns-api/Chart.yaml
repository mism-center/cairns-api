apiVersion: v2
name: cairns-api
description: CAIRNS Recommendation API — LLM/NLP search support service for model-discovery
type: application
version: 0.2.0
appVersion: "1.1.1"
keywords: [cairns, tooldb, biomodels, rag, nlp-search]

# Qdrant ships with the release when qdrant.enabled=true; otherwise point
# vectorStore.url at an existing cluster instance. Ollama is never bundled —
# the LLM backend is always external (vLLM / cloud / a shared Ollama).
dependencies:
  - name: qdrant
    version: "1.19.0"
    repository: https://qdrant.github.io/qdrant-helm
    condition: qdrant.enabled

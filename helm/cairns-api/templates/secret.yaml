{{/* Only rendered when an inline key is supplied; use llm.openai.existingSecret in prod. */}}
{{- if and (not .Values.llm.openai.existingSecret) .Values.llm.openai.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cairns-api.fullname" . }}-llm
  labels: {{- include "cairns-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.llm.openai.apiKey | quote }}
{{- end }}

{{/*
Subpath mount. Prefix match with NO rewrite: the app strips the prefix itself via
root_path, which keeps /docs and the OpenAPI server URL correct.
*/}}
{{- if .Values.ingress.enabled }}
{{- $path := include "cairns-api.rootPath" . | default "/" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cairns-api.fullname" . }}
  labels: {{- include "cairns-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "cairns-api.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}

# One-command stack for collaborators:  docker compose up
#
#   qdrant  – vector store (QV index)
#   ollama  – local LLM + embeddings (comment out if using a cloud API backend)
#   api     – the CAIRNS Recommendation API (this project)
#
# First-time index build (run once, after the stack is up):
#   docker compose run --rm api bash scripts/build_indexes.sh
#
# Put your ToolDB catalog JSON at ./data/tooldb.json (mounted to /data/tooldb.json).
services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    # For GPU: install the NVIDIA container toolkit and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    depends_on:
      - qdrant
      - ollama
    volumes:
      - ./data:/data
    ports:
      - "${API_PORT:-8000}:8000"
